import com.google.gson.GsonBuilder
import com.google.gson.Strictness
import com.google.gson.ToNumberPolicy
import org.gradle.api.DefaultTask
import org.gradle.api.GradleException
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.*

buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'com.google.code.gson:gson:2.11.0' }
}

@CacheableTask
abstract class GenerateManageAdsConfig extends DefaultTask {
    @Input abstract Property<String> getConfigText()
    @Input abstract Property<String> getConfigPath()
    @Input abstract Property<String> getPackageName()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @OutputFile abstract RegularFileProperty getManifestFile()

    static Map parse(String text, String path) {
        def requireField = { boolean valid, String message ->
            if (!valid) throw new GradleException("${path}: ${message}")
        }
        def root
        try {
            root = new GsonBuilder().setStrictness(Strictness.STRICT)
                .setObjectToNumberStrategy(ToNumberPolicy.LONG_OR_DOUBLE)
                .create().fromJson(text, Object)
        } catch (Exception error) {
            throw new GradleException("${path}: invalid JSON", error)
        }
        def fields = { obj, names, label ->
            requireField(obj instanceof Map, "${label} must be an object")
            def unknown = obj.keySet() - names
            requireField(unknown.empty, "${label} unknown fields: ${unknown}")
        }
        fields(root, ['enabled', 'admobAppId', 'placements', 'startup'], 'root')
        requireField(root.enabled instanceof Boolean, 'enabled must be boolean')
        requireField(root.admobAppId instanceof String && root.admobAppId ==~ /ca-app-pub-\d{16}~\d{10}/, 'invalid admobAppId')
        requireField(root.placements instanceof Map, 'placements must be an object')
        root.placements.each { name, slot ->
            requireField(name ==~ /[A-Za-z0-9_.-]+/, "invalid placement name ${name}")
            fields(slot, ['format', 'unitId'], "placements.${name}")
            requireField(slot.format in ['app_open', 'interstitial', 'native', 'banner'], "${name}.format is invalid")
            requireField(slot.unitId instanceof String && slot.unitId ==~ /ca-app-pub-\d{16}\/\d{10}/, "${name}.unitId is invalid")
        }
        fields(root.startup, ['preloadStages', 'enterHome'], 'startup')
        def references = { values, label ->
            requireField(values instanceof List && values.every { it instanceof String && root.placements.containsKey(it) },
                "${label} contains an unknown placement or is not an array")
            requireField(values.toSet().size() == values.size(), "${label} contains duplicates")
        }
        def duration = { value, label ->
            requireField((value instanceof Integer || value instanceof Long) && value >= 0, "${label} must be a nonnegative integer")
        }
        def scheduled = [] as Set
        requireField(root.startup.preloadStages instanceof List, 'startup.preloadStages must be an array')
        root.startup.preloadStages.eachWithIndex { stage, index ->
            String label = "startup.preloadStages[${index}]"
            fields(stage, ['placements', 'timeoutMs'], label)
            references(stage.placements, "${label}.placements")
            requireField(!stage.placements.empty, "${label}.placements is empty")
            stage.placements.each { name ->
                requireField(root.placements[name].format != 'banner', "${name} requires a measured banner container")
                requireField(scheduled.add(name), "${name} is scheduled twice")
            }
            duration(stage.timeoutMs, "${label}.timeoutMs")
        }
        def gate = root.startup.enterHome
        fields(gate, ['waitFor', 'placements', 'maxWaitMs', 'showBeforeHome'], 'startup.enterHome')
        requireField(gate.waitFor in ['none', 'sdk', 'any', 'all'], 'enterHome.waitFor is invalid')
        if (!gate.containsKey('placements')) gate.placements = []
        references(gate.placements, 'enterHome.placements')
        requireField((gate.waitFor in ['all', 'any']) == !gate.placements.empty, 'enterHome.placements must be nonempty only for any/all')
        requireField(scheduled.containsAll(gate.placements), 'enterHome.placements must appear in preloadStages')
        duration(gate.maxWaitMs, 'enterHome.maxWaitMs')
        if (gate.showBeforeHome != null) {
            requireField(scheduled.contains(gate.showBeforeHome) && root.placements[gate.showBeforeHome].format == 'app_open',
                'enterHome.showBeforeHome requires a scheduled app_open placement')
        }
        return root
    }

    static String names(List values) {
        return 'listOf(' + values.collect { "\"${it}\"" }.join(', ') + ')'
    }

    @TaskAction void generate() {
        def config = parse(configText.get(), configPath.get())
        def slots = config.placements.collect { name, slot ->
            "\"${name}\" to Placement(AdFormat.${slot.format.toUpperCase(Locale.ROOT)}, \"${slot.unitId}\")"
        }
        def stages = config.startup.preloadStages.collect { stage ->
            "PreloadStage(${names(stage.placements)}, ${stage.timeoutMs}L)"
        }
        def gate = config.startup.enterHome
        def show = gate.showBeforeHome == null ? 'null' : "\"${gate.showBeforeHome}\""
        def output = outputDirectory.file('AppAdsConfig.kt').get().asFile
        output.parentFile.mkdirs()
        output.setText("""package dev.manage.ads

internal object AppAdsConfig {
    val value = AdsConfig(
        enabled = ${config.enabled},
        placements = mapOf(${slots.join(',\n            ')}),
        preloadStages = listOf(${stages.join(',\n            ')}),
        enterHome = EnterHome(WaitFor.${gate.waitFor.toUpperCase(Locale.ROOT)}, ${names(gate.placements)}, ${gate.maxWaitMs}L, ${show})
    )
}
""", 'UTF-8')
        def hostAlias = outputDirectory.file('HostAdsConfig.kt').get().asFile
        if (packageName.get() != 'dev.manage.ads') {
            hostAlias.setText("""package ${packageName.get()}

internal typealias AppAdsConfig = dev.manage.ads.AppAdsConfig
""", 'UTF-8')
        } else {
            java.nio.file.Files.deleteIfExists(hostAlias.toPath())
        }
        def manifest = manifestFile.get().asFile
        manifest.parentFile.mkdirs()
        manifest.setText("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application>
        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="${config.admobAppId}" />
    </application>
</manifest>
""", 'UTF-8')
    }
}

def targetAppPath = extensions.extraProperties.has('manageAdsAppPath') ?
    extensions.extraProperties.get('manageAdsAppPath') : ':app'
if (findProject(targetAppPath) == null) {
    throw new GradleException("ads: include ${targetAppPath} before applying ads/ads.gradle, or set manageAdsAppPath to your application module path")
}

gradle.settingsEvaluated { settings ->
    settings.dependencyResolutionManagement.repositories {
        if (findByName('Google') == null) google()
        if (findByName('MavenRepo') == null) mavenCentral()
        if (findByName('GoogleHsdp') == null) {
            exclusiveContent {
                forRepository { google { name = 'GoogleHsdp' } }
                filter { includeModule('com.google.android.play', 'hsdp') }
            }
        }
        maven {
            url = uri('https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea')
            content { includeGroupByRegex(/com\.mbridge.*/) }
        }
        maven {
            url = uri('https://artifact.bytedance.com/repository/pangle/')
            content { includeGroupByRegex(/com\.pangle.*/) }
        }
    }
}

def configureAds = { Project app ->
    app.extensions.getByName('android').sourceSets.main.kotlin.srcDir(app.rootProject.file('ads'))
    app.dependencies {
        implementation 'com.google.android.gms:play-services-ads:25.5.0'
        implementation 'androidx.lifecycle:lifecycle-runtime:2.9.4'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
        implementation 'com.google.android.play:hsdp:2.2.0'
        implementation 'com.google.ads.mediation:applovin:13.6.4.2'
        implementation 'com.google.ads.mediation:facebook:6.22.0.0'
        implementation 'com.google.ads.mediation:mintegral:17.1.81.1'
        implementation('com.google.ads.mediation:pangle:8.3.0.4.0') {
            exclude group: 'com.pangle.global', module: 'tiktok-business-android-sdk-comp'
        }
    }
    def components = app.extensions.getByName('androidComponents')
    components.onVariants(components.selector().all()) { variant ->
        def flavors = variant.productFlavors.collect { it.second }
        def sourceSets = ([variant.name, variant.buildType, variant.flavorName] + flavors + ['main']).findAll { it }.unique()
        def files = sourceSets.collect { app.layout.projectDirectory.file("src/${it}/ads.json") }
        files.add(app.rootProject.layout.projectDirectory.file('ads/ads.json'))
        def selected = files.find { it.asFile.isFile() }
        if (selected == null) throw new GradleException("${app.path}: missing ads.json for ${variant.name}; checked ${files}")
        def text = app.providers.fileContents(selected).asText
        def path = app.rootProject.relativePath(selected.asFile)
        def namespace = variant.namespace
        def output = app.layout.buildDirectory.dir("generated/manageAds/${variant.name}")
        variant.manifestPlaceholders.put('manageAdsAppId', text.map { GenerateManageAdsConfig.parse(it, path).admobAppId })
        def generator = app.tasks.register("generate${variant.name.capitalize()}AdsConfig", GenerateManageAdsConfig) {
            configText.set(text)
            configPath.set(path)
            packageName.set(namespace)
            outputDirectory.set(output)
        }
        variant.sources.kotlin.addGeneratedSourceDirectory(generator, { it.outputDirectory })
        variant.sources.manifests.addGeneratedManifestFile(generator, { it.manifestFile })
    }
}

gradle.beforeProject { app ->
    if (app.path == targetAppPath) {
        app.pluginManager.withPlugin('com.android.application') { configureAds(app) }
    }
}
